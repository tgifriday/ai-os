[defaults]
primary = "network"
fallback = ["network", "cloud"]
max_context_tokens = 4096
stream_responses = true

# In-process GGUF inference via embedded llama.cpp (no external server).
# Requires a build with the `local-inference` feature (see `make build-local`)
# and a downloaded model (see `scripts/fetch-local-model.sh`). Enable this and
# disable [network] to run fully self-contained.
[local]
enabled = false
model_path = "~/.aios/models/qwen2.5-coder-3b-instruct-q4_k_m.gguf"
threads = 4
gpu_layers = 0
n_ctx = 4096

[network]
enabled = true
url = "http://localhost:11434"
# Small, fast, CPU-friendly code/CLI model well suited to shell assistance
# (command generation, output explanation, typo/error recovery).
model = "qwen2.5-coder:3b"

[cloud.openai]
enabled = false
api_key_env = "OPENAI_API_KEY"
model = "gpt-4o"

[cloud.anthropic]
enabled = false
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-4-20250514"

# ── Mission Control (opt-in usage tracking) ──────────────────────────────────
# Tracks token usage, cost estimates, and latency per query.
# All data stays local unless you configure a webhook.
# View session stats with the `usage` command inside the shell.
[mission_control]
enabled = false
# log_path = "~/.config/aios/mission-control.jsonl"
# webhook_url = "https://hooks.slack.com/services/..."
# max_log_mb = 50
