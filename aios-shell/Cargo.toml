[package]
name = "aios-shell"
description = "AIOS AI-powered shell - the primary user interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aish"
path = "src/main.rs"

[[bin]]
name = "aios-shell"
path = "src/main.rs"

[[bin]]
name = "aios-os"
path = "src/main_os.rs"

[features]
# Forwards to aios-llm's embedded llama.cpp GGUF backend. Build with
# `make build-local` (needs Rust >= 1.85, cmake, a C/C++ compiler, clang).
local-inference = ["aios-llm/local-inference"]

[dependencies]
aios-kernel = { path = "../aios-kernel" }
aios-core = { path = "../aios-core" }
aios-llm = { path = "../aios-llm" }
aios-knowledge = { path = "../aios-knowledge" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossterm = "0.28"
chrono = { workspace = true }
dirs = "6"
glob = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
