name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Great — the best features come from real users with real problems.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that AIOS doesn't support yet?
      placeholder: |
        I work on air-gapped systems and need AIOS to work with no network at all.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would the ideal solution look like?
      description: Describe what you'd want to happen.
      placeholder: |
        A `--offline` flag that disables all network calls and only uses local GGUF models.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds or other tools you've tried?

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Shell features (parsing, pipes, completion)
        - AI / LLM (backends, prompts, context)
        - Error recovery / suggestions
        - Config / deployment
        - Docker / containers
        - OS layer (aios-os)
        - Documentation
        - Other
